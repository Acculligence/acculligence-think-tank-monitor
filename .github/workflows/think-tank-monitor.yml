name: Acculligence Think Tank Monitor MVP

on:
  workflow_dispatch:
    inputs:
      start:
        description: Start date YYYY-MM-DD
        required: true
        default: '2026-07-25'
      end:
        description: End date YYYY-MM-DD
        required: true
        default: '2026-07-31'
      profile:
        description: Knowledge Profile
        required: true
        type: choice
        options:
          - saudi_arabia
        default: saudi_arabia

concurrency:
  group: acculligence-think-tank-monitor-mvp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate configuration
        run: |
          test -f config/source_registry.json
          test -f "config/profiles/${{ inputs.profile }}.json"
          python - <<'PY'
          import json
          registry = json.load(open('config/source_registry.json', encoding='utf-8'))
          profile = json.load(open('config/profiles/${{ inputs.profile }}.json', encoding='utf-8'))
          assert registry.get('sources'), 'No sources found'
          assert profile.get('terms'), 'Profile has no terms'
          print({'sources': len(registry['sources']), 'profile': profile['profile_name'], 'terms': len(profile['terms'])})
          PY

      - name: Collect and match publications
        run: |
          rm -rf output/current_run
          python collector.py \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            --map config/source_registry.json \
            --profile "config/profiles/${{ inputs.profile }}.json" \
            --output output/current_run

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: think-tank-monitor-${{ inputs.profile }}-${{ inputs.start }}-${{ inputs.end }}
          path: output/current_run/
          if-no-files-found: error
          retention-days: 30
