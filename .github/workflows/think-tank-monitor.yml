name: Think Tank Acquisition Map and Monitor v4

on:
  workflow_dispatch:
    inputs:
      start:
        description: Start date YYYY-MM-DD
        required: true
        default: '2026-07-25'
      end:
        description: End date YYYY-MM-DD
        required: true
        default: '2026-07-31'
      rebuild_map:
        description: Rebuild acquisition map
        required: true
        type: choice
        options: ['no', 'yes']
        default: 'no'

concurrency:
  group: think-tank-monitor-v4
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build validated acquisition map
        if: ${{ github.event.inputs.rebuild_map == 'yes' || hashFiles('config/acquisition_map.json') == '' }}
        run: python build_acquisition_map.py

      - name: Save acquisition map
        if: ${{ github.event.inputs.rebuild_map == 'yes' || hashFiles('config/acquisition_map.json') == '' }}
        run: |
          git config user.name "Acculligence Bot"
          git config user.email "bot@acculligence.com"
          git add config/acquisition_map.json
          git commit -m "Update validated acquisition map" || true
          git push || true

      - name: Ensure acquisition map exists
        run: test -f config/acquisition_map.json

      - name: Collect publications safely
        run: |
          python collector.py \
            --start "${{ github.event.inputs.start }}" \
            --end "${{ github.event.inputs.end }}" \
            --source-workers 8 \
            --article-workers 6 \
            --source-timeout 75 \
            --request-timeout 12 \
            --max-candidates 240

      - name: Upload outputs and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: think-tank-monitor-${{ github.event.inputs.start }}-${{ github.event.inputs.end }}
          path: output/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit outputs and checkpoints
        if: always()
        run: |
          git config user.name "Acculligence Bot"
          git config user.email "bot@acculligence.com"
          git pull --rebase || true
          git add output/ config/acquisition_map.json
          git commit -m "Update think tank monitoring output" || true
          git push || true
