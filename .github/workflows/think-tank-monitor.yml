name: Think Tank Acquisition Map and Monitor

on:
  workflow_dispatch:
    inputs:
      start:
        description: Start date YYYY-MM-DD
        required: true
        default: '2026-07-25'
      end:
        description: End date YYYY-MM-DD
        required: true
        default: '2026-07-31'
      rebuild_map:
        description: Rebuild acquisition map
        required: true
        type: choice
        options:
          - 'yes'
          - 'no'
        default: 'yes'

  schedule:
    - cron: '20 3 * * *'

jobs:
  collect:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build validated acquisition map
        if: ${{ github.event_name == 'schedule' || github.event.inputs.rebuild_map == 'yes' }}
        run: python build_acquisition_map.py

      - name: Ensure acquisition map exists
        run: test -f config/acquisition_map.json

      - name: Collect publications
        run: |
          START="${{ github.event.inputs.start }}"
          END="${{ github.event.inputs.end }}"

          if [ -z "$START" ]; then
            START=$(date -u +%Y-%m-%d)
          fi

          if [ -z "$END" ]; then
            END=$(date -u +%Y-%m-%d)
          fi

          python collector.py --start "$START" --end "$END"

      - name: Commit acquisition map and outputs
        run: |
          git config user.name "Acculligence Bot"
          git config user.email "bot@acculligence.com"
          git add config/acquisition_map.json output/
          git commit -m "Update acquisition map and monitoring output" || exit 0
          git push
